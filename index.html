l,"placeUrl":"","visits":1,"total":48000,"depts":"농업경영과","deptCount":1,"firstDate":"2025-07-16","lastDate":"2025-07-16"},{"name":"카페24페이먼츠","rawName":"카페24페이먼츠","status":"위치못찾음","note":"지도 검색 결과 없음 (폐업/오타/간판명 다름 가능)","category":"","address":"","lat":null,"lng":null,"placeUrl":"","visits":1,"total":152400,"depts":"농업기술과","deptCount":1,"firstDate":"2025-07-28","lastDate":"2025-07-28"},{"name":"힐푸드","rawName":"힐푸드","status":"위치못찾음","note":"지도 검색 결과 없음 (폐업/오타/간판명 다름 가능)","category":"","address":"","lat":null,"lng":null,"placeUrl":"","visits":1,"total":93000,"depts":"농업기술과","deptCount":1,"firstDate":"2025-07-10","lastDate":"2025-07-10"}]};
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

document.getElementById('title').textContent = DATA.region + ' 업무추진비 식당지도';
document.getElementById('sub').textContent = '자료 기간 ' + DATA.period + ' · 갱신 ' + DATA.updated;

const map = L.map('map', { zoomControl: true }).setView([37.49, 127.49], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function popupHtml(p) {
  const nm = enc(p.name), q = enc(p.name + ' ' + (p.address || ''));
  return '<div class="pop"><div class="t">' + esc(p.name) + '</div>' +
    '<div>' + esc(p.category) + '</div><div>' + esc(p.address) + '</div>' +
    (p.status === '확인필요' ? '<div class="warnbox">⚠ 이름으로만 찾은 위치라 다를 수 있음<br>' + esc(p.note) + '<br>엑셀 표기: ' + esc(p.rawName) + '</div>' : '') +
    '<div style="margin-top:6px">방문 <b>' + p.visits + '회</b> · 총 ' + won(p.total) + '</div>' +
    '<div>이용: ' + esc(p.depts) + '</div><div>최근 ' + esc(p.lastDate) + '</div>' +
    '<div class="links">' +
      (p.placeUrl ? '<a class="k" href="' + esc(p.placeUrl) + '" target="_blank" rel="noopener">카카오맵 정보</a>' : '') +
      '<a class="k" href="https://map.kakao.com/link/to/' + nm + ',' + p.lat + ',' + p.lng + '" target="_blank" rel="noopener">카카오 길찾기</a>' +
      '<a class="nv" href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">네이버지도</a>' +
      '<a class="tm" href="tmap://route?rGoName=' + nm + '&rGoX=' + p.lng + '&rGoY=' + p.lat + '">티맵</a>' +
    '</div></div>';
}

const layers = { '확인완료': L.layerGroup().addTo(map), '확인필요': L.layerGroup().addTo(map) };
const markers = [];
DATA.places.forEach(p => {
  if (p.lat == null) return;
  const color = p.status === '확인완료' ? '#2563eb' : '#ea8a00';
  const r = Math.min(14, 6 + Math.sqrt(p.visits) * 2);
  const m = L.circleMarker([p.lat, p.lng], { radius: r, color: '#fff', weight: 2, fillColor: color, fillOpacity: .9 })
    .bindPopup(popupHtml(p), { maxWidth: 300 });
  (layers[p.status] || layers['확인필요']).addLayer(m);
  markers.push({ p, m });
});
const okList = DATA.places.filter(p => p.status === '확인완료');
const inRegion = okList.length ? okList : DATA.places;
if (inRegion.length) map.fitBounds(L.latLngBounds(inRegion.map(p => [p.lat, p.lng])).pad(0.1));

document.getElementById('cOk').textContent = okList.length;
document.getElementById('cWarn').textContent = DATA.places.length - okList.length;

function toggle(id, key) {
  const el = document.getElementById(id);
  el.onclick = () => { el.classList.toggle('off'); if (map.hasLayer(layers[key])) map.removeLayer(layers[key]); else map.addLayer(layers[key]); };
}
toggle('fOk', '확인완료'); toggle('fWarn', '확인필요');

const list = document.getElementById('list');
function itemHtml(p, i) {
  const dot = p.status === '확인완료' ? 'ok' : (p.status === '확인필요' ? 'warn' : '');
  return '<div class="item" data-i="' + i + '"><div class="n">' + (dot ? '<span class="dot ' + dot + '"></span>' : '') + esc(p.name) + '</div>' +
    '<div class="m">' + p.visits + '회 · ' + won(p.total) + ' · ' + esc(p.depts) + (p.address ? ' · ' + esc(p.address) : '') + '</div></div>';
}
list.innerHTML = DATA.places.map(itemHtml).join('') +
  (DATA.unfound.length ? '<h3>위치를 못 찾은 곳 (' + DATA.unfound.length + ') — 지도에 없음</h3>' +
    DATA.unfound.map(p => '<div class="item"><div class="n">' + esc(p.rawName) + '</div><div class="m">' + p.visits + '회 · ' + won(p.total) + ' · ' + esc(p.depts) +
      ' · <a href="https://map.naver.com/p/search/' + enc(DATA.region + ' ' + p.rawName) + '" target="_blank" rel="noopener">네이버에서 찾기</a></div></div>').join('') : '');
list.onclick = e => {
  const it = e.target.closest('.item[data-i]'); if (!it) return;
  const p = DATA.places[+it.dataset.i]; const mk = markers.find(x => x.p === p);
  sheet.classList.remove('open');
  if (mk) { map.setView([p.lat, p.lng], 16); mk.m.openPopup(); }
};
const sheet = document.getElementById('sheet');
document.getElementById('listBtn').onclick = () => sheet.classList.toggle('open');
document.getElementById('closeBtn').onclick = () => sheet.classList.remove('open');
</script>
